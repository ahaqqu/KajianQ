name: Staging
# Deploy to the VPS staging environment on every push/merge outside `paths-ignore`,
# and on demand (workflow_dispatch) for rollbacks/re-runs. Post-ADR-0044 the
# serving host is the netcup VPS: the `deploy` job delegates to the reusable
# `deploy-vps.yml` workflow, so the deploy command lives in exactly one place
# (issue #181's deployer separation). Docs-and-tests-only pushes (markdown,
# docs/, adr/, NOTICES/, .agents/, .zcode/, tests/**, *.test.ts, *.test.mjs,
# and the test-support class stated at the patterns below) cannot change the
# deployed artifact, so they skip the push trigger — a deploy plus its paid
# smoke would be pure spend with no new artifact to verify.
# GitHub skips a push only when EVERY changed file matches an ignore pattern,
# so a push mixing docs/tests and code still deploys. A tests-only merge
# produces no `Staging` run by design; `CI`, `E2E` and `VPS restore drill`
# still run on `main` (they do not ignore test patterns).
#
# This workflow carries NO corpus-ingest job (ADR-0037). Loading the corpus
# costs real money (embeddings + cheap-tier parent summaries) and about two
# hours, so it is an operator-driven local action — `bun run ingest:quran` /
# `bun run ingest:hadith` from the repo root against DATABASE_URL (the VPS
# staging database; issue #181's pre-migration note). A money-spending job must
# never sit in the same workflow graph as this evidence job: previously a failed
# ingest skipped the smoke entirely, spending money and producing no evidence
# for it.
#
# A red Golden Set smoke deliberately stops `post deploy checks`: `ZAP baseline`
# and `Schemathesis fuzz` do not run after it — not an oversight but the accepted
# trade of #360 (two extra job starts to scan an unhealthy deployment, declined).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "adr/**"
      - "NOTICES/**"
      - ".agents/**"
      - ".zcode/**"
      # Test patterns by convention, not by directory: most *.test.ts are
      # colocated under apps/ and packages/, so tests/** alone would leave them
      # deploying.
      # Test SUPPORT is coupled by purpose instead (#380): a helper, a shared
      # fixture, or a runner config whose whole purpose is to serve tests. It
      # has to be named somewhere, because a test-only change almost always
      # travels with the suites that use it, and GitHub skips a push only when
      # EVERY changed file matches — so one unmatched support file used to make
      # the whole merge deploy and pay the smoke (#280's spend, re-entered).
      # The invariant that makes the coupling safe is:
      #   "a file whose whole purpose is test support is never imported by
      #    production code"
      # Verified, not assumed, at the commit that added these patterns: every
      # importer of a matched path is itself a *.test.ts or another member of
      # this class, and fresh builds of all four deploy artifacts contain zero
      # occurrences of any matched name.
      # The failure mode of this coupling is a SILENTLY SKIPPED DEPLOY: a
      # production module placed under a test-utils/ directory, or named
      # *test-utils* / test-fixtures*, stops deploying while CI and E2E stay
      # green.
      # ENFORCED, not merely documented (#399): `bun run lint` runs
      # scripts/check-paths-ignore-invariant.mjs, which parses the patterns
      # below, matches them over `git ls-files` with GitHub's glob semantics
      # (`*` never crosses `/`, `**` does), and fails when a matched path is in
      # the STATIC IMPORT CLOSURE of the four deploy entries named at the end of
      # this block. That closure is computed from imports, never from a name
      # list, so a rename that moves a production module into this class fails
      # the gate; and when the check cannot read this trigger it refuses
      # (non-zero) rather than passing.
      # This class is repo-wide, not a staging.yml property: e2e.yml and
      # vps-restore-drill.yml ignore only the docs patterns and are recorded as
      # #379. Do not copy this block into them — both also trigger on
      # pull_request, where a path-ignored workflow never reports at all, so each
      # workflow's patterns and invariant must be derived from its own trigger
      # set; a pasted class statement is the drift #378's B4 removed. The check
      # polices THIS push trigger only, and refuses if either workflow grows a
      # non-docs class, so #379's class cannot land there unguarded.
      # No step in this workflow executes a test, and no test-class file
      # reaches a shipped artifact: deploy.sh builds build:web,
      # apps/api/src/boot.ts, apps/api/src/cleanup.ts and
      # provision/vps/backup/kajianq-backup.mjs; build:web typechecks
      # apps/web/src/**/*.test.ts (22 files) as `tsc --noEmit` input, and
      # `vp build` emits only index.html's import graph — so no test file
      # enters dist/ and a tests-only merge ships a byte-identical artifact.
      - "tests/**"
      - "**/*.test.ts"
      - "**/*.test.mjs"
      - "**/test-utils/**"
      - "**/*test-utils*"
      - "**/test-fixtures*"
      - "vitest.config.ts"
      - "playwright.config.ts"
  workflow_dispatch:
    inputs:
      # Operator knobs for the Golden Set smoke (SPECS §3.7). On a push these
      # are empty, so the env fallbacks on the smoke step apply the spec
      # defaults (5 questions, $1 cap).
      eval_smoke_size:
        description: "Golden Set smoke subset size (questions; spec default 5)"
        required: false
        default: "5"
      eval_budget_micro_usd:
        description: "Hard spend cap for the smoke run in micro-USD (1000000 = $1)"
        required: false
        default: "1000000"

# Serialize staging runs: a push-to-main deploy and a manual dispatch would
# otherwise race on the same VPS tree and on the ledger the smoke writes
# (eval_runs/eval_results/answer_traces). A deploy is never cancelled
# mid-flight. (deploy-vps.yml carries its own `deploy-vps` group; this group
# serializes the workflow's jobs with each other.)
concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # ---------------------------------------------------------------------------
  # Deploy. The actual build → ship → restart → smoke lives in the reusable
  # deploy-vps.yml workflow and provision/vps/deploy/deploy.sh — one
  # implementation, so this workflow cannot drift from the operator path. The
  # job runs on every push to main and every dispatch.
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy
    uses: ./.github/workflows/deploy-vps.yml
    with:
      environment: staging
    secrets:
      VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}

  # ---------------------------------------------------------------------------
  # Post-deploy checks — the evidence job. Its Golden Set smoke step is what a
  # PR cites (SPECS §3.7). Needs `deploy` so the checks always run against a
  # fresh, healthy deployment, and a failed deploy skips them instead of
  # scanning or scoring a stale environment.
  # ---------------------------------------------------------------------------
  post-deploy-checks:
    name: post deploy checks
    needs: deploy
    runs-on: ubuntu-latest
    # The ZAP container image, pinned BY DIGEST — the single bump site for the
    # scan's image, referenced by the pre-pull step, the `docker_name` input and
    # the failure classifier. Never `:stable`: a floating tag is the one input
    # that can change between two runs of an unchanged commit (#382).
    #
    # Sourced from the registry, because the run logs do NOT carry it: the
    # action calls `docker pull <image> -q`, and `-q` suppresses the digest
    # line, so the logs of both cited runs name only
    # `ghcr.io/zaproxy/zaproxy:stable`. The digest below is that tag's OCI
    # index digest as resolved on 2026-10-03:
    #   docker buildx imagetools inspect ghcr.io/zaproxy/zaproxy:stable \
    #     --format '{{.Manifest.Digest}}'
    # It is also the build both cited runs used: the index's linux/amd64
    # manifest was created 2026-08-07 from zaproxy@2665d972, weeks before both
    # runs of 07cb2914, and the tag still resolves to it — so it cannot have
    # moved between them. The pin therefore closes the class "the image changed
    # under an unchanged commit"; it is not the proven cause of run
    # 37118454475's abort.
    #
    # Update trigger — a deliberate bump, in its own commit, never a floating
    # tag: a ZAP stable release (the image is rebuilt from zaproxy main), or a
    # ZAP security advisory affecting the baseline scan. Bump by re-resolving
    # the digest with the command above; the merge's own `Staging` run then
    # exercises the new image end-to-end, because `.github/**` is not in this
    # workflow's paths-ignore.
    env:
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # The PR-time behavioural gate (SPECS §3.7, ticket #10): a deterministic
      # stratified slice of the Golden Set — refusal, dhaif trap, English, and
      # Indonesian cases — answered by the *deployed* API and scored from its
      # persisted answer traces through the same harness and ledger as eval:run.
      # It exits non-zero on any failure, skip, or unmeasured question — the
      # shared policy `eval:run` applies too (#364) — so a staging deploy that
      # breaks grounded answering or the refusal gate cannot go green. This is
      # also the post-cutover health signal against the VPS (issue #181: it was
      # red on the Cloudflare free-plan CPU wall before the move).
      #
      # The harness authenticates as an anonymous user (ADR-0017) — the same
      # public route the PWA uses, so the token is minted here rather than
      # carried as a secret. The retry tolerates a slow restart after the
      # deploy; the token is masked so it never lands in the log.
      - name: Mint anonymous eval session
        id: eval-token
        run: |
          set -uo pipefail
          attempt=1
          while [ "$attempt" -le 5 ]; do
            if body=$(curl -sf -X POST "$STAGING_URL/v1/auth/anonymous"); then
              token=$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
              if [ -n "$token" ]; then
                echo "::add-mask::$token"
                echo "token=$token" >> "$GITHUB_OUTPUT"
                echo "minted an anonymous session on attempt ${attempt}"
                exit 0
              fi
            fi
            echo "anonymous session attempt ${attempt}/5 failed; waiting 5s for the restart..."
            sleep 5
            attempt=$((attempt + 1))
          done
          echo "::error::could not mint an anonymous session from ${STAGING_URL}/v1/auth/anonymous"
          exit 1
        env:
          STAGING_URL: ${{ vars.VPS_PUBLIC_URL }}
      # The eval harness reads persisted answer traces from the store behind the
      # RagStore seam (traceable-by-design), and the VPS Postgres is loopback-only
      # by hardening posture (ADR-0044 decision 5). A GitHub runner reaches it
      # only through an ssh tunnel — the same shape the cutover runbook's
      # post-cutover snapshot uses. The tunnel lives for the smoke step's shell;
      # the strict host-key check is accepted because the key is environment-
      # scoped to this repo.
      - name: Open ssh tunnel to the VPS database
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/id_ed25519 <<< "$SSH_KEY"
          ssh -f -N -o StrictHostKeyChecking=accept-new -L 15433:127.0.0.1:5432 "$KAJIANQ_DEPLOY_USER@$KAJIANQ_DEPLOY_HOST"
          echo "KAJIANQ_DB_TUNNEL_UP=1" >> "$GITHUB_ENV"
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          KAJIANQ_DEPLOY_USER: ${{ vars.VPS_USER }}
          KAJIANQ_DEPLOY_HOST: ${{ vars.VPS_HOST }}
      - name: Golden Set smoke
        # The summary is written to the job page even when the smoke fails —
        # that is the evidence a reviewer reads, so it must not be skipped by
        # the failing exit code. The log is kept locally and teed to the job.
        # Exit semantics (#290): this step fails on ANY failed OR skipped
        # question. A skip is an unmeasured question, not a pass — a transport
        # outage must not buy a green release — and the skip's cause is
        # persisted per question and printed as a `skipped: <message>` line, so
        # the red is actionable from the log and from `eval_results`.
        # Attribution (#340): a scored failure prints a `failed: <questionId> …`
        # line naming the dimension that missed, so the block is what answers
        # "which question, which dimension". The extraction below is
        # size-INDEPENDENT by construction: it takes the log from the summary's
        # own header to EOF, so the counts, the three means and every
        # per-question line stay whole at any `eval_smoke_size`. (`tail -n 60`
        # was the opposite of that: it keeps the BOTTOM of the log, so once a
        # widened subset pushed the log past 60 lines, the counts and means this
        # block opens with were the lines clipped away.)
        run: |
          set -uo pipefail
          bun run eval:smoke 2>&1 | tee /tmp/eval-smoke.log
          status=${PIPESTATUS[0]}
          # From the summary's header line to EOF — everything the block needs,
          # nothing sized by a constant. When the smoke died before printing a
          # summary (a config or secret failure), there is no header to match:
          # fall back to the whole log, which is short and is the entire failure.
          block=$(awk '/^eval:smoke summary/{found=1} found' /tmp/eval-smoke.log)
          if [ -z "$block" ]; then
            block=$(cat /tmp/eval-smoke.log)
          fi
          {
            echo "### Golden Set smoke — staging"
            echo ""
            echo '```'
            printf '%s\n' "$block"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          EVAL_API_BASE_URL: ${{ vars.VPS_PUBLIC_URL }}
          EVAL_API_TOKEN: ${{ steps.eval-token.outputs.token }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          # STAGING_DATABASE_URL must name the tunnel port (15433) — the DB is loopback-only.
          # Fail-closed spend cap (ADR-0034): unset would be an explicit opt-out,
          # so the workflow always sets one. 1000000 micro-USD = $1 per run.
          EVAL_BUDGET_MICRO_USD: ${{ github.event.inputs.eval_budget_micro_usd || '1000000' }}
          EVAL_SMOKE_SIZE: ${{ github.event.inputs.eval_smoke_size || '5' }}
          EVAL_RUN_LABEL: staging-smoke-${{ github.sha }}
      # The image is prepared in its own step so a registry or image failure is
      # attributed BEFORE the scan: this step goes red by name, the scan never
      # runs, and "did the site regress?" is not even a possible reading. The
      # action's own `docker pull` then hits the local cache — no second
      # download. The pre-scan container list is snapshotted here for the
      # classifier below, which identifies the scan's container from the
      # difference when `docker ps --filter ancestor` does not resolve a digest
      # reference on the runner.
      - name: ZAP image pre-pull
        id: zap-image
        run: |
          set -euo pipefail
          mkdir -p zap-failure
          docker ps -aq > zap-failure/containers-before.txt
          docker pull "$ZAP_IMAGE" >/dev/null
          digests=$(docker image inspect "$ZAP_IMAGE" --format '{{json .RepoDigests}}')
          case "$digests" in
            *"$ZAP_IMAGE"*)
              echo "pinned image ready: $ZAP_IMAGE (repo digests: $digests)"
              ;;
            *)
              echo "::error::docker resolved $ZAP_IMAGE to unexpected repo digests: $digests"
              exit 1
              ;;
          esac
      - name: ZAP baseline
        id: zap
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.VPS_PUBLIC_URL }}
          # Template policy: suppressions live in the rule file with inline
          # justifications — never a workflow-level bypass.
          rules_file_name: .github/zap-rules.tsv
          fail_action: true
          # Pinned by digest through the job-level ZAP_IMAGE (the single bump
          # site): EVERY input to this step is pinned — the action by SHA
          # (…de8ad967), the container image by digest (…sha256:781a2bda…), and
          # the rule file by the commit this run checks out. #382
          docker_name: ${{ env.ZAP_IMAGE }}
        # ZAP stays metered (its action interface makes header injection
        # unreliable); the baseline scan's request volume fits the /v1 budget.
      # Attribution (#382), never a gate: this runs only after the scan (or its
      # pre-pull) has already failed, so it cannot turn the job green. It names
      # the CLASS in the job summary — "the scanner broke" versus "the site
      # regressed", which the job's colour alone cannot tell apart — and keeps
      # the container logs that the abort path otherwise loses with the run (the
      # action's `docker run` carries no --rm, so the aborted container is still
      # on the runner here). The `|| echo` fallback belongs to THIS diagnostic
      # step only: the scan above keeps `fail_action: true` and has no fallback
      # of any kind.
      - name: ZAP failure attribution
        if: failure() && (steps.zap.outcome == 'failure' || steps.zap-image.outcome == 'failure')
        env:
          ZAP_IMAGE_OUTCOME: ${{ steps.zap-image.outcome }}
          ZAP_SCAN_OUTCOME: ${{ steps.zap.outcome }}
        run: |
          set -uo pipefail
          bun scripts/zap-failure-attribution.mjs >> "$GITHUB_STEP_SUMMARY" || \
            echo "### ZAP baseline attribution — unavailable (the classifier itself failed; the step log above is the evidence)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ZAP failure diagnostics
        if: failure() && (steps.zap.outcome == 'failure' || steps.zap-image.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-failure-diagnostics
          path: zap-failure/
          if-no-files-found: warn
          # 14 days, the window the Art. 30 record declares for ops logs
          # (ADR-0043 decision 4). The baseline scan is unauthenticated, so this
          # artifact holds no personal data — the cap is posture, not exposure.
          retention-days: 14
      - name: Schemathesis fuzz
        # schemathesis.toml suppresses unsupported_method (an intermediary may
        # return 405 without an Allow header — not our app's behavior). See the
        # config file for the justification comment.
        # No bearer token: the unauthenticated surface (401 on the guarded
        # routes) is documented — /v1/chat returns 401 without a session,
        # 503 chat_not_configured only when the DATABASE_URL binding is
        # absent (required in the deploy job above, so fuzzing always sees a
        # live route).
        # The fuzz carries a rate-limit bypass token (ADR-0041) when the
        # signer key is configured — scanner bursts must not exhaust the
        # per-IP /v1 budget mid-scan; the token exempts metering only.
        run: |
          pip install schemathesis
          BYPASS_ARGS=()
          if [ -n "$RATE_BYPASS_PRIVATE_KEY" ]; then
            TOKEN=$(bun run rate:bypass --sub schemathesis)
            BYPASS_ARGS+=(--header "X-Rate-Bypass: $TOKEN")
          fi
          schemathesis run "$STAGING_URL/openapi.json" \
            --url "$STAGING_URL" \
            "${BYPASS_ARGS[@]}" \
            --checks all
        env:
          STAGING_URL: ${{ vars.VPS_PUBLIC_URL }}
          RATE_BYPASS_PRIVATE_KEY: ${{ secrets.RATE_BYPASS_PRIVATE_KEY }}
