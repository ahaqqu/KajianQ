name: Staging
on:
  workflow_dispatch:

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Require secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$STAGING_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_URL: ${{ vars.STAGING_URL }}
      - run: bunx wrangler d1 migrations apply agentic-template-db-staging --remote --env staging -c apps/api/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: bun run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke health
        run: curl -sf "$STAGING_URL/v1/health" | grep -q '"status":"ok"'
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
      # Blocking gates (D6): a ZAP or Schemathesis failure fails the workflow.
      # Suppressing a finding requires an inline rule file entry with a
      # justification comment — never a workflow-level bypass.
      - name: ZAP baseline
        uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae # v0.12.0
        with:
          target: ${{ vars.STAGING_URL }}
      - name: Schemathesis fuzz
        run: |
          pip install schemathesis
          schemathesis run --base-url "$STAGING_URL" "$STAGING_URL/openapi.json" --checks all
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
