name: Staging
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Require secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$STAGING_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_URL: ${{ vars.STAGING_URL }}
      - name: Inject D1 database_id (staging)
        run: bun run deploy:inject:staging
        env:
          D1_DATABASE_ID_STAGING: ${{ secrets.D1_DATABASE_ID_STAGING }}
      - run: bunx wrangler d1 migrations apply DB --remote --env staging -c apps/api/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: bun run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID_STAGING: ${{ secrets.D1_DATABASE_ID_STAGING }}
      - name: Smoke health
        run: curl -sf "$STAGING_URL/v1/health" | grep -q '"status":"ok"'
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
      # Blocking gates (D6): a ZAP or Schemathesis failure fails the workflow.
      # Suppressing a finding requires an inline rule file entry with a
      # justification comment — never a workflow-level bypass.
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.STAGING_URL }}
      - name: Schemathesis fuzz
        # schemathesis.toml suppresses unsupported_method (Cloudflare edge
        # returns 405 without Allow header — not our app's behavior). See the
        # config file for the justification comment.
        # Auth: create a session so /v1/sync doesn't 401.
        run: |
          pip install schemathesis
          TOKEN=$(curl -sf -X POST "$STAGING_URL/v1/session" | jq -r '.token')
          schemathesis run "$STAGING_URL/openapi.json" \
            --url "$STAGING_URL" \
            --checks all \
            -H "Authorization: Bearer $TOKEN"
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
