name: Deploy production
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Inject D1 database_id
        run: bun run deploy:inject
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      - run: bunx wrangler d1 migrations apply DB --remote -c apps/api/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      # Retry logic lives in the reusable composite action (issue #49):
      # Cloudflare edge propagation can lag a few seconds after wrangler
      # deploy returns, so wait and retry rather than failing transiently.
      - name: Smoke health
        uses: ./.github/actions/smoke-health
        with:
          name: Health
          url: ${{ vars.PROD_URL }}/v1/health
      - name: Smoke session
        uses: ./.github/actions/smoke-health
        with:
          name: Session
          url: ${{ vars.PROD_URL }}/v1/session
          method: POST
          success-pattern: sessionId
