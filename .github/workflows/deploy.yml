name: Deploy production
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Deploys via Alchemy from apps/api/alchemy.run.ts (ADR-0028). The
      # one-time `bun run deploy:bootstrap` (--adopt takeover + state-store
      # bootstrap) must have been run by an operator first; CI=true makes the
      # state store resolve its credentials from the Cloudflare Secrets Store.
      # The five secret env vars must resolve at alchemy plan time — the stack
      # declares them as Config.redacted bindings on the Worker.
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      # Retry logic lives in the reusable composite action (issue #49):
      # Cloudflare edge propagation can lag a few seconds after the deploy
      # returns, so wait and retry rather than failing transiently.
      - name: Smoke health
        uses: ./.github/actions/smoke-health
        with:
          name: Health
          url: ${{ vars.PROD_URL }}/v1/health
      - name: Smoke session
        uses: ./.github/actions/smoke-health
        with:
          name: Session
          url: ${{ vars.PROD_URL }}/v1/session
          method: POST
          success-pattern: sessionId
