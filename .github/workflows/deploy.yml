name: Deploy production
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Inject D1 database_id
        run: bun run deploy:inject
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      - run: bunx wrangler d1 migrations apply DB --remote -c apps/api/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      - name: Smoke
        run: |
          curl -sf "$PROD_URL/v1/health" | grep -q '"status":"ok"'
          curl -sf -X POST "$PROD_URL/v1/session" | grep -q sessionId
        env:
          PROD_URL: ${{ vars.PROD_URL }}
