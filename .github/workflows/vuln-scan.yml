name: Vulnerability scan
# Runs on every merge to main and nightly.
#
# Deliberately NOT on `pull_request`: a PR push does not change the dependency
# surface beyond what the lockfile already pins, so scanning every push would
# pay a full run per commit for an answer the merge itself supplies — while the
# advisory feed, which changes independently of this repository, is what the
# nightly run covers. The merge trigger is what gives a red gate a reader: the
# run lands on the merger's timeline instead of a 04:00 schedule nobody watches.
on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: OSV-Scanner
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.0.1/osv-scanner_linux_amd64 \
            -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan --lockfile=bun.lock
      - name: Surface Dependabot alerts
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Dependabot has no public "trigger re-run" API; it runs on its own
          # schedule. On an OSV failure we list open Dependabot alerts so the
          # workflow log shows what Dependabot already knows about. Requires
          # the repo setting Dependabot security alerts enabled.
          gh api repos/${{ github.repository }}/dependabot/alerts \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --jq '.[] | select(.state == "open") | [.security_advisory.ghsa_id, .dependency.package.name, .dependency.scope, .security_vulnerability.first_patched_version.identifier] | @tsv' || true
