name: E2E
# Docs-only changes (markdown, docs/, adr/, NOTICES/, .agents/, .zcode/) cannot
# change app behaviour the BDD suite exercises, so they skip both the
# pull_request and push triggers. GitHub skips a trigger only when EVERY
# changed file matches an ignore pattern, so a change mixing docs and code
# still runs. workflow_dispatch is unaffected — an operator can always run it.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "adr/**"
      - "NOTICES/**"
      - ".agents/**"
      - ".zcode/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "adr/**"
      - "NOTICES/**"
      - ".agents/**"
      - ".zcode/**"
  workflow_dispatch:

jobs:
  bdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium --with-deps
      # playwright.config.ts's webServer boots the plain Bun entry
      # (apps/api/src/boot.ts) against the build this step produces — the same
      # serving host the VPS runs (ADR-0044), so the suite exercises production's
      # runtime rather than a workerd shim.
      - run: bun run e2e
        env:
          CI: true
