name: E2E
# Docs-only and test-class-only changes cannot change the app behaviour the BDD
# suite exercises, so the push trigger ignores the docs class and the test class
# staging.yml defines (tests/**, *.test.ts, *.test.mjs, and the test-support
# helpers and runner configs named there). This workflow applies that class
# minus its own two inputs: tests/features and tests/steps are the suite
# `bun run e2e` executes, and playwright.config.ts selects them, so a change to
# either still runs E2E. GitHub skips a trigger only when EVERY changed file
# matches an ignore pattern, so a change mixing docs/tests and code still runs.
#
# pull_request keeps the docs class only: a path-ignored workflow does not fail
# on a PR, it never reports at all, so widening that half is a gating decision,
# not a trigger edit. scripts/check-paths-ignore-invariant.mjs refuses a wider
# PR filter and checks this push class against the workflow's own execution
# closure. workflow_dispatch is unaffected — an operator can always run it.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "adr/**"
      - "NOTICES/**"
      - ".agents/**"
      - ".zcode/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "adr/**"
      - "NOTICES/**"
      - ".agents/**"
      - ".zcode/**"
      # The shared test class minus `tests/**` and playwright.config.ts: those
      # two ARE this suite's input, so they are deliberately not listed. The
      # check named in the header keeps every other member in sync with
      # staging.yml and proves none of them reaches the closure this workflow
      # executes.
      - "**/*.test.ts"
      - "**/*.test.mjs"
      - "**/test-utils/**"
      - "**/*test-utils*"
      - "**/test-fixtures*"
      - "vitest.config.ts"
  workflow_dispatch:

jobs:
  bdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium --with-deps
      # playwright.config.ts's webServer boots the plain Bun entry
      # (apps/api/src/boot.ts) against the build this step produces — the same
      # serving host the VPS runs (ADR-0044), so the suite exercises production's
      # runtime rather than a workerd shim.
      - run: bun run e2e
        env:
          CI: true
