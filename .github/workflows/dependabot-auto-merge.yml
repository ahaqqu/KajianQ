name: Dependabot auto-merge
# Polls for open Dependabot PRs on a schedule instead of reacting to the
# pull_request event. A PR-triggered workflow always appears in the checks
# list of every PR (as "skipped" when filtered by author); a scheduled one
# never does, while still auto-merging Dependabot PRs.
#
# Single-package PRs carry "from <old> to <new>" in the title; the semver kind
# is derived from that range. Grouped-update PRs have no title range, so the
# PR body's update table is parsed instead: every row must classify as
# minor/patch (no major, downgrade, or pre-release) for the group to auto-merge.
# Requires the repo setting "Allow auto-merge" (Settings -> General -> Pull
# Requests) in every repository.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for patch/minor Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pre-release/build-metadata suffixes are stripped BEFORE splitting
          # into numeric components, so a suffix's digits are never concatenated
          # onto a numeric component (the old `sed 's/[^0-9]//g'` per-component
          # made `1.3.0-alpha.1` parse as `1.3.01`, classifying a pre-release
          # down-grade as a patch bump). Any pre-release involved → human review:
          # semver ranks `1.2.3-rc.1` below `1.2.3`, so a Dependabot PR that
          # moves to/from a pre-release is never a safe auto-merge.
          semver_kind() {
            local o n o1 o2 o3 n1 n2 n3
            o=${1#v}; n=${2#v}
            o=${o%%-*}; n=${n%%-*}
            o1=${o%%.*};  o=${o#*.}; o2=${o%%.*}; o=${o#*.}; o3=${o%%.*}
            n1=${n%%.*};  n=${n#*.}; n2=${n%%.*}; n=${n#*.}; n3=${n%%.*}
            case "$o1" in *[!0-9]*|'') o1=0;; esac
            case "$o2" in *[!0-9]*|'') o2=0;; esac
            case "$o3" in *[!0-9]*|'') o3=0;; esac
            case "$n1" in *[!0-9]*|'') n1=0;; esac
            case "$n2" in *[!0-9]*|'') n2=0;; esac
            case "$n3" in *[!0-9]*|'') n3=0;; esac
            if   [ "$n1" -ne "$o1" ]; then [ "$n1" -gt "$o1" ] && echo major || echo downgrade
            elif [ "$n2" -ne "$o2" ]; then [ "$n2" -gt "$o2" ] && echo minor || echo downgrade
            elif [ "$n3" -ne "$o3" ]; then [ "$n3" -gt "$o3" ] && echo patch || echo downgrade
            else echo unchanged; fi
          }

          # Grouped-update PRs (title "bump the minor-patch group with N updates")
          # have no "from X to Y" range. Their body holds a Markdown table with a
          # `From`/`To` column per package. Auto-merge only if EVERY row classifies
          # as minor/patch with no pre-release; any major/downgrade/prerelease or
          # unparseable row leaves the whole group for human review.
          classify_group() {
            local body="$1" rows from to kind
            rows=$(printf '%s\n' "$body" \
              | grep -E '^\| \[' \
              | sed -E 's/.*`([^`]+)`.+`([^`]+)`.*/\1 \2/')
            [ -z "$rows" ] && { echo "no-table"; return; }
            while read -r from to; do
              [ -z "$from" ] || [ -z "$to" ] && { echo "unparseable-row"; return; }
              kind=$(semver_kind "$from" "$to")
              case "$from" in *-*) kind=prerelease;; esac
              case "$to"   in *-*) kind=prerelease;; esac
              case "$kind" in patch|minor) ;; *) echo "$kind"; return;; esac
            done <<< "$rows"
            echo "auto"
          }

          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,title,author \
            | jq -c '.[] | select(.author.login == "app/dependabot" or .author.login == "dependabot[bot]")' \
            | while read -r pr; do
                number=$(printf '%s' "$pr" | jq -r .number)
                title=$(printf '%s' "$pr" | jq -r .title)
                old=$(printf '%s' "$title" | sed -nE 's/.*from (v?[0-9][^ ]*) to (v?[0-9][^ ]*).*/\1/p')
                new=$(printf '%s' "$title" | sed -nE 's/.*from (v?[0-9][^ ]*) to (v?[0-9][^ ]*).*/\2/p')
                if [ -z "$old" ] || [ -z "$new" ]; then
                  # Grouped-update PR: parse the body's update table and
                  # auto-merge only if every row is minor/patch with no pre-release.
                  body=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
                  verdict=$(classify_group "$body")
                  case "$verdict" in
                    auto)
                      echo "PR #$number: group update (all minor/patch) — enabling auto-merge"
                      gh pr merge --auto --squash "$number" --repo "$GITHUB_REPOSITORY" \
                        || echo "  failed — is 'Allow auto-merge' enabled in repository settings?"
                      ;;
                    *)
                      echo "PR #$number: group update, blocked by $verdict — leaving for human review"
                      ;;
                  esac
                  continue
                fi
                kind=$(semver_kind "$old" "$new")
                # A pre-release on either side (1.2.3-rc.1, 1.3.0-alpha.2) is never
                # a safe auto-merge: semver ranks pre-releases below the release,
                # and a stable→pre-release Dependabot bump is a downgrade even
                # when the numeric part goes up.
                case "$old" in *-*) kind=prerelease;; esac
                case "$new" in *-*) kind=prerelease;; esac
                case "$kind" in
                  patch|minor)
                    echo "PR #$number: $kind update — enabling auto-merge"
                    gh pr merge --auto --squash "$number" --repo "$GITHUB_REPOSITORY" \
                      || echo "  failed — is 'Allow auto-merge' enabled in repository settings?"
                    ;;
                  *)
                    echo "PR #$number: $kind update — leaving for human review"
                    ;;
                esac
              done
