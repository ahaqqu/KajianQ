name: Template Sync
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: template-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Resolve default branch
        id: default
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          default=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
          echo "branch=${default}" >> "$GITHUB_OUTPUT"
      - run: bun run template-sync init
        env:
          TEMPLATE_SYNC_UPSTREAM: ${{ vars.TEMPLATE_SYNC_UPSTREAM }}
      - run: bun run template-sync update --branch=template-sync
        env:
          TEMPLATE_SYNC_UPSTREAM: ${{ vars.TEMPLATE_SYNC_UPSTREAM }}
      - name: Push sync branch
        run: |
          if ! git rev-parse --verify -q template-sync >/dev/null; then
            echo "Nothing to sync"
            exit 0
          fi
          if git diff --quiet "origin/${{ steps.default.outputs.branch }}" template-sync; then
            echo "No changes to sync"
            exit 0
          fi
          git push --force-with-lease origin template-sync
      - name: Open sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git rev-parse --verify -q template-sync >/dev/null; then
            echo "Nothing to sync"
            exit 0
          fi
          base="${{ steps.default.outputs.branch }}"
          if git diff --quiet "origin/${base}" template-sync; then
            echo "No changes to sync"
            exit 0
          fi
          count=$(gh pr list --head template-sync --state open --json number --jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "Sync PR already open"
            exit 0
          fi
          gh pr create --base "${base}" --head template-sync \
            --title "chore: sync template updates" \
            --body "Automated merge of upstream template changes. Review the diff, then merge and delete the template-sync branch."
