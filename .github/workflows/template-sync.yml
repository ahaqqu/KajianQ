name: Template Sync
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: template-sync
  # A scheduled run and a workflow_dispatch run can overlap. The job force-pushes
  # the shared `template-sync` branch; a newer run cancels the older to avoid two
  # runs racing the same branch with --force-with-lease.
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Match ci.yml: the sync scripts import workspace packages
          # (packages/infra, packages/contracts), so deps must be installed
          # before any template-sync command runs.
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Resolve default branch
        id: default
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          default=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
          echo "branch=${default}" >> "$GITHUB_OUTPUT"
      - run: bun run template-sync init
        env:
          TEMPLATE_SYNC_UPSTREAM: ${{ vars.TEMPLATE_SYNC_UPSTREAM }}
      - name: Require merge commits in repository settings
        id: merge-settings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          allow_merge=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_merge_commit')
          if [ "$allow_merge" != "true" ]; then
            echo "::error::Repository must allow merge commits for template-sync to preserve the upstream merge-base. Go to Settings > General > Pull Requests and enable 'Allow merge commits'."
            exit 1
          fi
          echo "allow_merge=true" >> "$GITHUB_OUTPUT"
      - run: bun run template-sync update --branch=template-sync
        env:
          TEMPLATE_SYNC_UPSTREAM: ${{ vars.TEMPLATE_SYNC_UPSTREAM }}
      - name: Push sync branch
        run: |
          if ! git rev-parse --verify -q template-sync >/dev/null; then
            echo "Nothing to sync"
            exit 0
          fi
          if git diff --quiet "origin/${{ steps.default.outputs.branch }}" template-sync; then
            echo "No changes to sync"
            exit 0
          fi
          git push --force-with-lease origin template-sync
      - name: Open sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git rev-parse --verify -q template-sync >/dev/null; then
            echo "Nothing to sync"
            exit 0
          fi
          base="${{ steps.default.outputs.branch }}"
          if git diff --quiet "origin/${base}" template-sync; then
            echo "No changes to sync"
            exit 0
          fi
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head template-sync --state open --json number --jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "Sync PR already open"
            exit 0
          fi
          # Use the REST API instead of `gh pr create` to avoid the GraphQL
          # "Resource not accessible by integration" error when the workflow
          # runs with the built-in GITHUB_TOKEN.
          gh api \
            --method POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/pulls" \
            -f title="chore: sync template updates" \
            -f body="Automated merge of upstream template changes. **This PR must be merged with 'Create a merge commit'.** Squash or rebase will destroy the upstream parent and break the next template sync." \
            -f head="template-sync" \
            -f base="${base}"
      - name: Enable auto-merge with merge method
        if: steps.merge-settings.outputs.allow_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head template-sync --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            echo "No sync PR to auto-merge"
            exit 0
          fi
          gh api \
            --method POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/merge" \
            -f merge_method="merge" \
            -f commit_title="chore: sync template updates" \
            -f commit_message="Automated merge of upstream template changes." || echo "Auto-merge request returned an error; the PR remains open for manual review."
