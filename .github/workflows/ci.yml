name: CI
on:
  pull_request:
  push:
    branches: [main]

# One run at a time per ref. The postgres-contract job writes to a SHARED
# service container, and the suite is idempotent by per-run fixture prefix
# except for primary-key collisions between concurrent runs (crypto.randomUUID
# is unique per insert, but a run's writes interleaving with another's deletes
# can surface transient unique violations, e.g. chat_sessions_pkey), so runs are
# serialized. Cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Installs the vp CLI pinned via the `vite-plus` devDependency (ADR-0029).
      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
      - run: bun run check
      - run: bun run lint
      # The default unit/coverage gate runs WITHOUT a database: the RagStore
      # contract tests (rag-store-postgres.test.ts) self-skip when DATABASE_URL
      # is unset, so this job stays green everywhere (including forks without
      # secrets) and the I/O adapter is excluded from coverage (see
      # vitest.config.ts) since it needs a server. The contract suite runs in
      # the separate postgres-contract job below.
      - run: bun run test
      # size-limit builds apps/web itself (bun run build:web inside the
      # script), so the measurement always matches the working tree — and a
      # fresh checkout (CI, new git worktree) never measures stale or missing
      # dist bytes. The former separate `bun run build` step was its only
      # consumer here and would now double-build.
      - run: bun run size-limit
      - run: bun run agentic-limits
      - run: bun run boundary
      - run: bun run openapi:check
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --verbose --redact --exit-code 1
      - name: Semgrep
        run: |
          pip install --quiet semgrep
          semgrep scan --config auto --error --quiet .

  # RagStore contract tests against a real Postgres + pgvector (ADR-0027
  # decision 7: the `postgres:contract` job). #181 moved this off the
  # secret-gated shared Neon database and onto a service container: the
  # migration's whole point is that the store is self-hosted, and a container is
  # the same pgvector/pg18 image the VPS runs — so the suite tests the real
  # schema in every environment, forks without secrets included, with no shared
  # external state to race.
  #
  # It engages on every PR touching packages/infra (the seam lives there) and on
  # every push to main.
  postgres-contract:
    name: postgres:contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: contract
          POSTGRES_PASSWORD: contract
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check whether this run touches packages/infra
        id: infra
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            # Three-dot diff: changes on the PR side since the merge base.
            if git diff --name-only "${BASE}...${HEAD}" | grep -q '^packages/infra/'; then
              echo "touched=true" >> "$GITHUB_OUTPUT"
            else
              echo "touched=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Push builds (main) always exercise the contract suite.
            echo "touched=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.infra.outputs.touched == 'true'
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        if: steps.infra.outputs.touched == 'true'
        run: bun install --frozen-lockfile
      # The suite exercises the seam against the CURRENT schema: apply the
      # migration sets first (idempotent via the schema_migrations ledger), so
      # an adapter change that depends on a new migration — e.g. the 0003
      # feedback dedup index its ON CONFLICT targets — cannot fail against a
      # drifted schema. All three sets, because the suite writes chat/trace rows
      # that reference the domain and product tables. Serialized by the
      # job-level concurrency group above.
      - name: Apply the migration sets
        if: steps.infra.outputs.touched == 'true'
        run: bun run db:up:all
        env:
          DATABASE_URL: postgres://contract:contract@127.0.0.1:5432/postgres
      # vp is the single test runner (ADR-0029): vp resolves from
      # node_modules/.bin, no setup-vp step needed here.
      - name: Run the Effect-shaped Postgres contract suite
        if: steps.infra.outputs.touched == 'true'
        run: bunx vp test run --no-file-parallelism packages/infra/src/rag-store-postgres.test.ts
        env:
          DATABASE_URL: postgres://contract:contract@127.0.0.1:5432/postgres
