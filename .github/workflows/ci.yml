name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Default unit/coverage gate runs WITHOUT the Neon secret: the RagStore
      # contract tests (rag-store-neon.test.ts) self-skip without it, so this
      # job stays green for fork PRs (no secret) and the I/O adapter is
      # excluded from coverage (see vitest.config.ts) since it needs the
      # secret. The contract suite runs in the separate neon-contract job.
      - run: bun run test
      - run: bun run build
      - run: bun run size-limit
      - run: bun run agentic-limits
      - run: bun run boundary
      - run: bun run truth
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --verbose --redact --exit-code 1
      - name: Semgrep
        run: |
          pip install --quiet semgrep
          semgrep scan --config auto --error --quiet .

  # Secret-gated RagStore contract tests against real Neon staging. The
  # suite self-skips when NEON_DATABASE_URL is empty (fork PRs have no
  # secret), so the job stays green there. When the secret is present it
  # runs in series (--no-file-parallelism) because the tests share one
  # fixture namespace keyed off a per-run prefix.
  neon-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # TEMPORARY (PR #72): the engine 0001 migration was edited in place
      # (fix-forward process), so shared staging's shape no longer matches the
      # repo. Roll the ENGINE set back and re-apply once so the contract tests
      # see the renamed embedding columns. This step is reverted on the branch
      # right after it has repaired staging; future fix-forwards use the manual
      # neon-schema-reapply.yml workflow. Staging is a disposable testbed
      # (README "Production bring-up"); domain/product sets are untouched.
      - name: Sync engine schema to repo (temporary)
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          migrate() { bun packages/infra/scripts/db-migrate.mjs "$@"; }
          migrate status
          for _ in $(seq 1 3); do
            # `|| rc=$?` keeps bash -e from killing us before we can print out.
            out=$(migrate down 2>&1) || rc=$?
            rc=${rc:-0}
            echo "${out:-<down produced no output>}"
            if [ "$rc" -ne 0 ]; then
              echo "::error::db-migrate down failed (rc=$rc)"
              exit "$rc"
            fi
            echo "$out" | grep -q "nothing to roll back" && break
          done
          migrate up
          migrate status
      - run: bunx vitest run --no-file-parallelism packages/infra/src/rag-store-neon.test.ts
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

  template-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Auto-seed template-sync state
        # If template-owned files match upstream main, re-seed so the gate
        # checks against the latest template. If they drifted (real drift),
        # seed refuses and the gate fails against the last known-good state.
        # --no-commit: write state file without committing (CI is ephemeral).
        # continue-on-error so the gate step is the actual gate, not the seed.
        run: bun run template-sync seed --ref=main --no-commit
        continue-on-error: true
      - run: bun run template-gate