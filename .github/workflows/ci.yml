name: CI
on:
  pull_request:
  push:
    branches: [main]

# One run at a time per ref. The postgres-contract job writes to a SHARED
# service container, and the suite is idempotent by per-run fixture prefix
# except for primary-key collisions between concurrent runs (crypto.randomUUID
# is unique per insert, but a run's writes interleaving with another's deletes
# can surface transient unique violations, e.g. chat_sessions_pkey), so runs are
# serialized. Cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Installs the vp CLI pinned via the `vite-plus` devDependency.
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
      - run: bun run check
      - run: bun run lint
      # The default unit/coverage gate runs WITHOUT a database: a gated suite
      # self-skips when DATABASE_URL is unset, so this job stays green
      # everywhere (including forks without secrets) and the I/O adapter is
      # excluded from coverage (see vitest.config.ts) since it needs a server.
      # The gated suites run in the separate postgres-contract job below.
      #
      # The JSON report is what makes that skip observable instead of silent: it
      # records, per collected file, whether its tests executed or were skipped.
      # `--require-marked` reads it and fails on three things, over the files
      # vitest.config.ts collects: a file that skipped a test without declaring the
      # directive — whole or partial; a file that reads DATABASE_URL in code position
      # without it, since a gate written as an early return reports a pass and skips
      # nothing and only the tree can see it; and a declaration whose file skipped
      # nothing, since a declaration keeps that file out of the static rule and a gate
      # that does not skip reports a pass whether or not a database is bound.
      #
      # A mention in a comment or in fixture text is not a read. It sees a read in code
      # position in these spellings: the property (chained or not), a quoted or template
      # subscript, a destructuring from `process.env`, `import.meta.env` or an `env`
      # object, a subscript by a key the file binds to the name, and `process["env"]` /
      # `import.meta.env`. Reads it does not see: one whose name the file never spells —
      # built by concatenation, held in a value bound elsewhere, or returned by a helper
      # module — and any read behind an alias of `process.env`. A suite that gates that
      # way and returns early instead of skipping leaves the report nothing to see, and a
      # test file the include globs do not collect is in no job at all.
      #
      # The report is written outside the checkout, so no generated file sits in the
      # tree the other gates scan.
      - name: Unit + coverage gate (no database)
        run: bun run test --reporter=default --reporter=json --outputFile.json="${RUNNER_TEMP}/vitest-report.json"
      - name: Every skipped suite runs, and every declaration gates
        run: bun scripts/pg-contract.mjs --require-marked "${RUNNER_TEMP}/vitest-report.json"
      # size-limit builds apps/web itself (bun run build:web inside the
      # script), so the measurement always matches the working tree — and a
      # fresh checkout (CI, new git worktree) never measures stale or missing
      # dist bytes. The former separate `bun run build` step was its only
      # consumer here and would now double-build.
      - run: bun run size-limit
      - run: bun run agentic-limits
      - run: bun run boundary
      - run: bun run openapi:check
      # Every relative doc link — and every inline code span naming a repo path
      # or a skill — must resolve. Docs here cite each other as evidence (an
      # Art. 30 TOMs row points at the executed cutover log, a skill points at
      # the runbook it implements), so a dangling one is a compliance claim
      # whose proof is gone — and GitHub renders it as plain text, so a reader
      # cannot tell. Agent-facing prose cites files as code spans more often
      # than as links, which is the shape that let a dead skill pointer pass CI
      # until #368. The doc consolidation made this load-bearing: retiring a
      # file means repointing its citations, and this is what proves that was
      # done. Scope, resolution base and every accepted blind spot are stated
      # in the gate's policy module (`scripts/markdown-links/policy.mjs`),
      # which is the contract its driver (`scripts/check-markdown-links.mjs`)
      # is checked against.
      - run: bun run docs:links
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --verbose --redact --exit-code 1
      - name: Semgrep
        run: |
          pip install --quiet semgrep
          semgrep scan --config auto --error --quiet .

  # RagStore contract tests against a real Postgres + pgvector (ADR-0027
  # decision 7: the `postgres:contract` job). #181 moved this off the
  # secret-gated shared Neon database and onto a service container: the
  # migration's whole point is that the store is self-hosted, and a container is
  # the same pgvector/pg18 image the VPS runs — so the suite tests the real
  # schema in every environment, forks without secrets included, with no shared
  # external state to race.
  #
  # It engages when a PR can change what those suites execute — the seam's own
  # home, a gated suite itself, or the gate's machinery — as derived by
  # `scripts/pg-contract.mjs --touched`, and on every push to main. A newly
  # added gated suite therefore re-engages the job on the PR that adds it.
  postgres-contract:
    name: postgres:contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: contract
          POSTGRES_PASSWORD: contract
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # bun comes up before the decision because the decision is derived, not
      # grepped: `--touched` asks the same policy module which suites are gated,
      # so a suite added in a new file re-engages this job instead of needing a
      # path edited into the workflow. The script needs no dependencies, so it
      # runs before the install.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Check whether this run can change what the contract suites execute
        id: contract
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Three-dot diff: changes on the PR side since the merge base. `-z`
            # is the one form git never quotes a path in (a quoted non-ASCII path
            # would match no declared suite), and the driver reads both
            # delimiters.
            git diff --name-only -z "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > "${RUNNER_TEMP}/changed.txt"
            bun scripts/pg-contract.mjs --touched "${RUNNER_TEMP}/changed.txt" >> "$GITHUB_OUTPUT"
          else
            # Push builds (main) always exercise the contract suites.
            echo "touched=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.contract.outputs.touched == 'true'
        run: bun install --frozen-lockfile
      # The suite exercises the seam against the CURRENT schema: apply the
      # migration sets first (idempotent via the schema_migrations ledger), so
      # an adapter change that depends on a new migration — e.g. the 0003
      # feedback dedup index its ON CONFLICT targets — cannot fail against a
      # drifted schema. All three sets, because the suite writes chat/trace rows
      # that reference the domain and product tables. Serialized by the
      # job-level concurrency group above.
      - name: Apply the migration sets
        if: steps.contract.outputs.touched == 'true'
        run: bun run db:up:all
        env:
          DATABASE_URL: postgres://contract:contract@127.0.0.1:5432/postgres
      # vp is the single test runner (the `@vitest/coverage-v8` pin tracks the
      # Vitest it bundles): vp resolves from node_modules/.bin, no setup-vp
      # step needed here.
      #
      # The file list comes from the derivation, never from this workflow: a
      # suite that declares the marker is selected with nobody editing this file.
      # It is captured under `set -e` first, so an empty derivation — which the
      # driver exits 1 on — aborts the step instead of running the whole suite
      # against the contract database.
      - name: Run every real-Postgres contract suite
        if: steps.contract.outputs.touched == 'true'
        env:
          DATABASE_URL: postgres://contract:contract@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          FILES="$(bun scripts/pg-contract.mjs --list)"
          # No `--no-file-parallelism`: vitest.config.ts serializes files whenever
          # DATABASE_URL is set, and DATABASE_URL is set here, so this run exercises
          # that default instead of overriding it. The suites share one database and
          # mutate its schema, which is why the config owns the serialization.
          bunx vp test run --reporter=default --reporter=json --outputFile.json="${RUNNER_TEMP}/pg-contract-report.json" $FILES
      # Derived selection is half the gate; this is the other half. The run's own
      # report says whether each selected suite executed, so a selection that skipped
      # anyway — DATABASE_URL not reaching the run, a suite gating on a different skip
      # condition — reddens here rather than reporting a green step that executed
      # nothing. A gate written as an early return is not this step's business: it
      # reports a pass either way, which is what the DB-less job's static rule is for.
      - name: Assert every selected suite executed
        if: steps.contract.outputs.touched == 'true'
        run: bun scripts/pg-contract.mjs --require-executed "${RUNNER_TEMP}/pg-contract-report.json"
