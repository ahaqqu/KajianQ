name: CI
on:
  pull_request:
  push:
    branches: [main]

# One run at a time per ref. The neon:contract job writes to a SHARED staging
# Neon database — parallel runs (a push and its own PR build, or two PRs)
# race each other's fixture writes on the same tables. The suite is idempotent
# by prefix EXCEPT for primary-key collisions between concurrent runs
# (crypto.randomUUID is unique per insert, but a run's writes interleaving
# with another's deletes can surface transient unique violations, e.g.
# chat_sessions_pkey), so the runs are serialized. Cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Installs the vp CLI pinned via the `vite-plus` devDependency (ADR-0029).
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
      - run: bun run check
      - run: bun run lint
      # Default unit/coverage gate runs WITHOUT the Neon secret: the RagStore
      # contract tests (rag-store-neon.test.ts) self-skip without it, so this
      # job stays green for fork PRs (no secret) and the I/O adapter is
      # excluded from coverage (see vitest.config.ts) since it needs the
      # secret. The contract suite runs in the separate neon-contract job.
      - run: bun run test
      - run: bun run build
      - run: bun run size-limit
      - run: bun run agentic-limits
      - run: bun run boundary
      - run: bun run truth
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --verbose --redact --exit-code 1
      - name: Semgrep
        run: |
          pip install --quiet semgrep
          semgrep scan --config auto --error --quiet .

  # Secret-gated RagStore contract tests against real Neon staging
  # (ADR-0027 decision 7: the `neon:contract` job). The suite self-skips
  # when NEON_DATABASE_URL is empty (fork PRs have no secret), so the job
  # stays green there. When the secret is present it runs in series
  # (--no-file-parallelism) because the tests share one fixture namespace
  # keyed off a per-run prefix. On pull requests the job only engages when
  # the PR touches packages/infra (the seam lives there); pushes to main
  # always run it so staging drift is caught.
  neon-contract:
    name: neon:contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check whether this run touches packages/infra
        id: infra
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            # Three-dot diff: changes on the PR side since the merge base.
            if git diff --name-only "${BASE}...${HEAD}" | grep -q '^packages/infra/'; then
              echo "touched=true" >> "$GITHUB_OUTPUT"
            else
              echo "touched=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Push builds (main) always exercise the contract suite.
            echo "touched=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.infra.outputs.touched == 'true'
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        if: steps.infra.outputs.touched == 'true'
        run: bun install --frozen-lockfile
      # vp is the single test runner (ADR-0029): vp resolves from
      # node_modules/.bin, no setup-vp step needed here.
      - name: Run the Effect-shaped Neon contract suite
        if: steps.infra.outputs.touched == 'true'
        run: bunx vp test run --no-file-parallelism packages/infra/src/rag-store-neon.test.ts
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

  template-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Auto-seed template-sync state
        # If template-owned files match upstream main, re-seed so the gate
        # checks against the latest template. If they drifted (real drift),
        # seed refuses and the gate fails against the last known-good state.
        # --no-commit: write state file without committing (CI is ephemeral).
        # continue-on-error so the gate step is the actual gate, not the seed.
        run: bun run template-sync seed --ref=main --no-commit
        continue-on-error: true
      - run: bun run template-gate
