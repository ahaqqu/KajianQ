version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    # Derived from the versions `vite-plus` bundles (`scripts/check-vp-vite-pin.mjs`):
    # these three move only in the change that moves `vite-plus`.
    ignore:
      - dependency-name: "vite"
      - dependency-name: "vitest"
      - dependency-name: "@vitest/coverage-v8"
    labels:
      - "dependencies"
      - "bun"
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    groups:
      minor-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
