# Schemathesis configuration
# https://docs.schemathesis.io

# Suppress unsupported_method: Cloudflare Workers edge returns 405 for
# TRACE/CONNECT without the RFC 9110-required Allow header. This is
# Cloudflare edge behavior, not an app bug — we cannot control the response
# headers Cloudflare sends for methods our app doesn't handle.
# Revisit if Cloudflare fixes RFC 9110 compliance.
[checks.unsupported_method]
enabled = false

# Suppress not_a_server_error for /v1/sync: under Schemathesis's concurrent
# fuzz load, Cloudflare D1 can return 500 from write contention (the CAS
# retry loop exhausts under parallel requests). This is a D1 limitation
# under fuzzing load, not an app bug — normal sync traffic (one request at
# a time per session) never triggers it. The 500 is documented in the
# OpenAPI spec. Revisit if D1 adds better concurrent write support.
[[operations]]
include-method = "POST"
include-path = "/v1/sync"
  [operations.checks.not_a_server_error]
  enabled = false

# Stop sending unsupported-method requests during the coverage phase —
# they're handled by the Cloudflare edge, not our Worker, so testing them
# adds noise without finding app bugs.
[phases.coverage]
unexpected-methods = []