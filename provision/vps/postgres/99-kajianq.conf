# provision/vps/postgres/99-kajianq.conf — self-hosted Postgres posture (ADR-0043, #180).
#
# Installed into /etc/postgresql/<version>/main/conf.d/, where Debian's
# postgresql.conf includes conf.d/*.conf.
#
# Two things are fixed here, and only two:
#
#   1. The database listens on the loopback interface only. The API process and
#      the backup/restore scripts run on the same box and reach Postgres over
#      the unix socket, so a public listener would widen the personal-data
#      surface with nothing gained. TLS is therefore not configured: the
#      traffic never leaves the host. If a second host ever needs the database,
#      that is a new decision (TLS + pg_hba entries), not an edit here.
#
#   2. Postgres logs are written to a file with rotation-friendly semantics and
#      no unbounded growth. The log can carry a client address in a connection
#      line (though those come from the local socket here), so it is treated as
#      personal-data-adjacent and rotated under the same 14-day policy as the
#      proxy log: daily segments, 14 kept, deleted after that (ADR-0043
#      decision 4 says "logrotate … for API, proxy, and Postgres logs; no
#      unbounded growth").
#
# stderr is disabled because journald is not the sink we want here: the file is
# rotated by /etc/logrotate.d/kajianq-postgres with an explicit retention, and
# duplicating every line into the journal would defeat that cap.

# --- reachability -----------------------------------------------------------
listen_addresses = 'localhost'
# Debian's default pg_hba.conf already allows only local socket + loopback
# peers; nothing in this file opens it further.

# --- logging ----------------------------------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
# 14 files, one per day — the same window as the proxy access log. logrotate
# renames and compresses the segments; `log_rotation_age` stays at 1d so the
# file names line up with logrotate's daily pass.
log_rotation_age = '1d'
log_rotation_size = '0'
log_truncate_on_rotation = on
log_line_prefix = '%m [%p] %q%u@%d '
log_connections = on
log_disconnections = on
# Statement text is never logged: a chat question is personal data (Art. 9
# adjacent) and does not belong in an ops log. Errors carry the statement only
# when a statement fails, which is the incident-triage case the log exists for.
log_statement = 'none'
log_min_duration_statement = -1
