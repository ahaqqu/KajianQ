# provision/vps/journald/kajianq.conf — API log retention cap (ADR-0043 decision 4, #180).
#
# Installed as /etc/systemd/journald.conf.d/kajianq.conf. The API writes
# structured JSON to stdout (no IP address, correlation id only), and journald
# captures it — so journald is where the "no unbounded log growth" rule binds
# for the API half, the way logrotate binds it for the proxy and Postgres.
#
#   SystemMaxUse=512M      — a hard byte ceiling on the persistent journal
#   MaxRetentionSec=14d    — the same 14-day window the proxy and Postgres logs
#                            use, so the whole box has ONE retention value
#                            rather than three that can drift
#   Storage=persistent     — journal survives reboot (the default "auto" would
#                            silently become volatile on a box without
#                            /var/log/journal, losing the incident-triage
#                            window)
#
# 14 days is deliberately the shortest of the windows the ADR fixes; the API
# log carries no IP and no message text, so this is a disk-hygiene cap rather
# than a personal-data retention. It is set to the same number anyway: one
# retention value is easier to keep true in the Art. 30 record than three.

[Journal]
Storage=persistent
SystemMaxUse=512M
SystemKeepFree=1G
MaxRetentionSec=14d
