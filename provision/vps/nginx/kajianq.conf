# provision/vps/nginx/kajianq.conf — KajianQ reverse proxy (ADR-0043, #180).
#
# Reverse-proxy choice: nginx. It is the de-facto reverse proxy, it lets the
# access-log format be fixed field-by-field (which is the whole point of the
# log policy below), and the codebase already assumes its semantics — the API's
# 499 "client closed request" handling in apps/api/src/lib/errors.ts. Caddy
# would also work; it buys nothing here because rotation is logrotate's job
# (ADR-0043 decision 4), not the proxy's.
#
# Access-log policy (ADR-0043 decision 4): the log carries the client IP
# (personal data, CJEU Breyer) for 14 days — and nothing else it does not need.
# The format is deliberately minimal:
#   - user-agent and referrer are NOT logged;
#   - $remote_user is NOT logged: it is only ever populated under HTTP basic
#     auth, which this server block never enables — and a username is not a
#     declared data category in the Art. 30 record, so the format does not
#     carry a field that could silently become one;
#   - the request line is kept: the Art. 30 record declares the request line
#     (P3: "IP address, request line, timestamp") and abuse investigation
#     needs the path; no request/response headers and no body are captured;
#   - $http_x_correlation_id is the API's own correlation id, which lets a
#     proxy line be tied to an API log line without logging more about the
#     visitor.
# Retention and rotation are enforced by /etc/logrotate.d/kajianq-proxy, not by
# anything nginx can do; this file only decides what is written.
#
# IP minimisation vs. retention: ADR-0043 decision 4 chose 14-day retention
# over dropping/masking the IP because the Art. 30 record declares "IP
# addresses in server access logs (14-day retention)" to netcup (GDPR-ARTICLE-30-RECORD
# §9) and abuse investigation needs the address. Masking the IP here would
# leave the declared data category false without any compensating benefit.
#
# The upstream must receive the client IP as CF-Connecting-IP: that is the
# header the API's rate limiter reads (apps/api/src/lib/middleware.ts), and
# nginx overwrites it unconditionally from $remote_addr, so a client-supplied
# value can never influence the limiter — the value is proxy-established,
# exactly as Cloudflare's was. Without this line the limiter would key every
# request to its "local" fallback and per-IP metering (ADR-0041) would silently
# collapse into one global bucket.
#
# The Cloudflare CDN proxy must stay OFF (DNS-only, ADR-0044 decision 4): with
# the orange cloud on, $remote_addr here is a Cloudflare EDGE address, so every
# visitor behind one edge POP would share one rate-limit budget and per-IP
# metering would break silently. Enabling the proxy later requires the
# ngx_http_realip_module BEFORE that switch: set_real_ip_from for Cloudflare's
# published IP ranges plus real_ip_header CF-Connecting-IP, so $remote_addr is
# the real client again. The API's middleware comment and ADR-0044 decision 4
# record the same rule.
#
# Placeholders (__KAJIANQ_*) are substituted by provision/vps/apply.sh from
# /etc/kajianq/proxy.env. No real hostname, certificate path, or origin address
# is committed to this repository.

log_format kajianq_access '$remote_addr - [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"cid=$http_x_correlation_id" rt=$request_time';

# The proxy's own error log can carry client addresses, so it is rotated under
# the same policy as the access log (see /etc/logrotate.d/kajianq-proxy).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __KAJIANQ_DOMAIN__;

    ssl_certificate     __KAJIANQ_TLS_CERT__;
    ssl_certificate_key __KAJIANQ_TLS_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/kajianq.access.log kajianq_access;
    error_log  /var/log/nginx/kajianq.error.log warn;

    client_max_body_size 1m;

    # The React PWA build (apps/web/dist) is served from disk; /v1/* and the
    # OpenAPI docs are proxied to the API process. Both paths are the same
    # origin, which is what the strict CORS posture (ALLOWED_ORIGINS) assumes.
    root /srv/kajianq/web;
    index index.html;

    location /v1/ {
        proxy_pass __KAJIANQ_API_UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrites any inbound value: the limiter trusts this header only
        # because the trusted edge sets it (see the header comment).
        proxy_set_header CF-Connecting-IP  $remote_addr;

        # SSE (/v1/chat streams its answer after review) must not be buffered
        # or timed out mid-answer.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
    }

    location = /openapi.json {
        proxy_pass __KAJIANQ_API_UPSTREAM__;
        proxy_set_header Host             $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    location /docs {
        proxy_pass __KAJIANQ_API_UPSTREAM__;
        proxy_set_header Host             $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    # The SPA and every static asset are served by nginx, so the security
    # headers the Worker era applied at the edge must be re-applied here —
    # the API routes carry their own (Hono secure-headers; app.test.ts pins
    # them), so these directives deliberately scope to this static location
    # to avoid double-setting on /v1/* responses. Values mirror the API's
    # CSP exactly (ZAP 10035/10038/10021/10063/10020; ADR-0044 header note).
    location / {
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://sentry.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri $uri/ /index.html;
    }
}

# Plain HTTP exists only to redirect; it logs nothing, so the 14-day IP-bearing
# log stays confined to the single TLS server block above.
server {
    listen 80;
    listen [::]:80;
    server_name __KAJIANQ_DOMAIN__;

    access_log off;
    return 301 https://$host$request_uri;
}
