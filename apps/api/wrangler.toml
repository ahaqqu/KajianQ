name = "kajianq-api"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# Persistence is Neon Postgres + pgvector behind the RagStore adapter
# (ADR-0008), provisioned by #4 — deliberately not Cloudflare D1. Blob storage
# uses R2 via the ObjectStore adapter (raw source archives, text_raw backups).

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "kajianq-raw"

[assets]
binding = "ASSETS"
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = true

[observability]
enabled = true

[vars]
APP_ENV = "production"
ALLOWED_ORIGINS = ""

[env.staging]
name = "kajianq-api-staging"
vars = { APP_ENV = "staging", ALLOWED_ORIGINS = "" }

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "kajianq-raw-staging"

[env.staging.assets]
binding = "ASSETS"
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = true
