name = "agentic-template"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "agentic-template-db"
# Sentinel: replace with the UUID from `wrangler d1 create` before first
# remote deploy. Local dev uses `preview_database_id` below; remote deploy
# injects the real UUID via a CI secret (see README §Deploy).
database_id = "replace-me-with-your-d1-uuid"
preview_database_id = "local-template-db"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "agentic-template-bucket"

[assets]
binding = "ASSETS"
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = true

[observability]
enabled = true

[vars]
APP_ENV = "production"
ALLOWED_ORIGINS = ""

[triggers]
crons = ["0 3 * * *"]

[env.staging]
name = "agentic-template-staging"
vars = { APP_ENV = "staging", ALLOWED_ORIGINS = "" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "agentic-template-db-staging"
# Sentinel: replace with the staging UUID from `wrangler d1 create` before
# first remote deploy. Local dev uses `preview_database_id` below.
database_id = "replace-me-with-your-d1-uuid-staging"
preview_database_id = "local-template-db-staging"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "agentic-template-bucket-staging"

[env.staging.assets]
binding = "ASSETS"
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = true
